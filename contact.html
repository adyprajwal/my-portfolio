<!-- Only ONE overlay -->
<div id="overlay">
  <div id="thankYouPopup">
    <span id="closePopup">&times;</span>
    Thank you for reaching out. I will get back to you soon!
  </div>

<style>
/* Overlay: hidden by default, flex centers the popup */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9990;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease-in-out, visibility 0.3s;
}

/* Show overlay */
#overlay.show {
    visibility: visible;
    opacity: 1;
}

/* Popup box */
#thankYouPopup {
    background: #5ed3d9;
    color: white;
    padding: 25px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    font-size: 18px;
    max-width: 90%;
    width: 400px;
    text-align: center;
    position: relative;
    transform: scale(0.9);
    transition: transform 0.3s ease-in-out;
}

/* Scale effect when shown */
#overlay.show #thankYouPopup {
    transform: scale(1);
}

/* Close button */
#closePopup {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 22px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    transition: color 0.2s;
}
#closePopup:hover {
    color: #f1f1f1;
}

/* Smaller screens */
@media (max-width: 480px) {
    #thankYouPopup {
        font-size: 16px;
        padding: 20px;
        width: 80%;
    }
}
</style>

<script>
const overlay = document.getElementById('overlay');
const closePopupBtn = document.getElementById('closePopup');
let autoHideTimer;

document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = e.target;
    const formData = new FormData(form);

    try {
        const response = await fetch("https://formspree.io/f/xwplbwok", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
            form.reset();
            showPopup();
        } else {
            alert("Oops! Something went wrong. Please try again.");
        }
    } catch (error) {
        alert("Network error. Please try again.");
    }
});

function showPopup() {
    overlay.classList.add('show');
    autoHideTimer = setTimeout(hidePopup, 3000);
}

function hidePopup() {
    overlay.classList.remove('show');
}

// Close when clicking the ×
closePopupBtn.addEventListener('click', () => {
    clearTimeout(autoHideTimer);
    hidePopup();
});

// Close when clicking overlay background
overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
        clearTimeout(autoHideTimer);
        hidePopup();
    }
});
</script>
